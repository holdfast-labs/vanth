name: Vanth CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_ssh:
        description: Run live SSH smoke against the configured disposable host
        type: boolean
        default: false
      run_long_soak:
        description: Run a ten-minute sustained soak on each platform
        type: boolean
        default: false

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
        exclude:
          - os: macos-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: uv sync --dev
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src tests examples
      - run: uv build
      - name: Smoke installed wheel
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test -e "${wheels[0]}"
          uv run --no-cache --isolated --no-project --with "${wheels[0]}" python -c "import vanth; print(vanth.__file__)"
      - name: Smoke bundled monitor console script
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test -e "${wheels[0]}"
          uv run --no-cache --isolated --no-project --with "${wheels[0]}" vanth-monitor --version

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: astral-sh/setup-uv@v10.1.0
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Cross-language fixture conformance
        run: |
          uv run python scripts/generate_go_fixture.py testdata
          go test ./internal/state/ -count=1
      - run: go build ./...
      - name: Fixture matches schema and representative rows
        shell: bash
        run: |
          uv run python - <<'PY'
          import sqlite3
          from vanth.migrations import LATEST_SCHEMA_VERSION
          db = sqlite3.connect('testdata/state/jobs.sqlite')
          assert db.execute('PRAGMA user_version').fetchone()[0] == LATEST_SCHEMA_VERSION
          jobs = {r[0]: r[3] for r in db.execute('SELECT job_id, name, command, status FROM jobs').fetchall()}
          assert jobs == {'job_completed': 'completed', 'job_running': 'running'}, jobs
          ev = {r[0] for r in db.execute('SELECT event_id FROM events').fetchall()}
          assert {'evt_complete', 'evt_progress'} <= ev, ev
          print('fixture semantic check OK')
          PY

  resilience:
    name: Resilience chaos matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: uv sync --dev
      - run: uv run python scripts/chaos_matrix.py
      - run: uv run python scripts/soak.py --duration 60 --report soak-report.json

  long-soak:
    name: Opt-in ten-minute soak
    if: github.event_name == 'workflow_dispatch' && inputs.run_long_soak
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'
      - run: uv sync --dev
      - run: uv run python scripts/soak.py --duration 600 --report soak-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak-${{ matrix.os }}
          path: soak-report.json

  real-ssh:
    name: Opt-in disposable SSH smoke
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_ssh
    runs-on: ubuntu-latest
    env:
      VANTH_SMOKE_SSH_TARGET: ${{ vars.VANTH_SMOKE_SSH_TARGET }}
      VANTH_SMOKE_SSH_FINGERPRINT: ${{ vars.VANTH_SMOKE_SSH_FINGERPRINT }}
      VANTH_SMOKE_SSH_PYTHON: ${{ vars.VANTH_SMOKE_SSH_PYTHON }}
      VANTH_SMOKE_SSH_HELPER: ${{ vars.VANTH_SMOKE_SSH_HELPER }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'
      - run: uv sync --dev
      - name: Install disposable bootstrap identity
        env:
          BOOTSTRAP_KEY: ${{ secrets.VANTH_SMOKE_SSH_BOOTSTRAP_KEY }}
        run: |
          test -n "$VANTH_SMOKE_SSH_TARGET"
          test -n "$BOOTSTRAP_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BOOTSTRAP_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - run: uv run pytest tests/remote/test_live_ssh.py -q -rs
