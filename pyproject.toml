[project]
name = "vanth"
version = "1.14.0"
description = "Event-driven background jobs for agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "abhim-dv", email = "abhishek.manilal@darkvisiontech.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "background-jobs",
    "agent",
    "ai",
    "task-runner",
    "daemon",
    "jobs",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Go",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0,<2.0",
    "loguru>=0.7,<1.0",
    # zoneinfo ships no tz database on Windows; named schedule timezones need it
    # there (Linux/macOS use the OS database). UTC works without it everywhere.
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
artifact-s3 = ["boto3>=1.28"]
# Build-only: `uv run --extra standalone python scripts/build_standalone.py`
standalone = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/holdfast-labs/vanth"
Repository = "https://github.com/holdfast-labs/vanth"
Documentation = "https://github.com/holdfast-labs/vanth#readme"
Changelog = "https://github.com/holdfast-labs/vanth/blob/master/CHANGELOG.md"
Issues = "https://github.com/holdfast-labs/vanth/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vanth = "vanth.cli:dispatch"
vanthd = "vanth.daemon:main"
vanth-codex-notify = "vanth.codex_bridge:main"
vanth-monitor = "vanth.monitor:main"
vanth-remote-helper = "vanth.remote.helper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "build-hooks/bundle_monitor.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes the tests/shellcmd.py helper importable from every test module,
# including the tests/artifacts and tests/remote subdirectories.
pythonpath = ["tests"]
